{% extends "layouts.html" %}

{% block content %}
<style>
  body {
         background-color: #303030;
         color: white;
      }

 </style>

<div class="mb-8 pd-6 container">
    <form method="POST">
        <h1 calss="mb-3"> Post </h1>
        <input class="mb-3 form-control" type="text" name="title" placeholder="title">
        <textarea class="mb-3 form-control" type="text" name="content" placeholder="share your thoughts"></textarea>
        <button class="btn btn-primary" type="submit">post</button>
    </form>
</div>
{% if error %}
    <div class="container">
        <div class="alert alert-danger">
            <p>{{ error }}</p>
        </div>
    </div>
{% endif %}

{% endblock %}
