{% extends "layouts.html" %}
{% block title %}Log in | BlogSpace{% endblock %}
{% block content %}
<div class="auth-shell">
    <section class="surface-card auth-card">
        <span class="eyebrow d-flex justify-content-center">Welcome back</span>
        <h1 class="page-heading">Log in to BlogSpace</h1>
        <p class="page-subtitle">Pick up where you left off and share what is on your mind.</p>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="visually-hidden" for="login-username">Username</label>
                <input class="form-control" id="login-username" type="text" name="username" placeholder="Username" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="visually-hidden" for="login-password">Password</label>
                <input class="form-control" id="login-password" type="password" name="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
        </form>

        <div class="auth-links">
            New here?&nbsp;<a href="{{ url_for('register') }}">Create an account</a>
        </div>
    </section>
</div>
{% endblock %}
