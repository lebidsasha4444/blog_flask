<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Login</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  body {
         background-color: #303030;
         color: white;
      }


  input {
         padding: 10px 20px;
         border-radius: 8px;

      }
 </style>

<body>


    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4">


          <form method="POST">
            <h1 class="text-center"> Welcome to log in</h1>
            <input  class="mb-3 form-control" type="text" name="username" placeholder="Username" required>
            <input  class="mb-3 form-control" type="password" name="password" placeholder="Password" required>

            <button class="btn btn-primary w-100" type="submit">Login</button>

          </form>

          <a class=" mt-3 text-end" href="{{ url_for('register') }}">Create an account</a>
        </div>
    </div>



    {%if error %}
      <p>{{error}}</p>
    {% endif %}

</body>
</html>
