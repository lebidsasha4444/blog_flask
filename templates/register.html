{% extends "layouts.html" %}
{% block title %}Create an account | BlogSpace{% endblock %}
{% block content %}
<div class="auth-shell">
    <section class="surface-card auth-card">
        <span class="eyebrow d-flex justify-content-center">Join the community</span>
        <h1 class="page-heading">Create your account</h1>
        <p class="page-subtitle">Start sharing your ideas with BlogSpace.</p>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="visually-hidden" for="register-username">Username</label>
                <input class="form-control" id="register-username" type="text" name="username" placeholder="Choose a username" autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="visually-hidden" for="register-password">Password</label>
                <input class="form-control" id="register-password" type="password" name="password" placeholder="Create a password" autocomplete="new-password">
            </div>
            <div class="mb-4">
                <label class="visually-hidden" for="register-email">Email address</label>
                <input class="form-control" id="register-email" type="email" name="email" placeholder="Email address" autocomplete="email">
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Create account</button>
        </form>

        <div class="auth-links">
            Already have an account?&nbsp;<a href="{{ url_for('login') }}">Log in</a>
        </div>
    </section>
</div>
{% endblock %}
