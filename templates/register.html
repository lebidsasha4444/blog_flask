<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>Register new account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
  body {
         background-color: #303030;
         color: white;
      }

 </style>

<body>
<div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4">
            <h1 class="text-center"> Create your account</h1>
            <form method="POST">

                <input class="mb-3 form-control" type="text" name="username" placeholder="type username">
                <input class="mb-3 form-control" type="password" name="password" placeholder="enter your password">
                <input class="mb-3 form-control" type="email" name="email" placeholder="enter your email">

                <button class="btn btn-primary w-100" type="submit">register</button>
            </form>
            <a class=" mt-3 text-end" href="{{ url_for('login') }}">Sign in your account</a>
    </div>
</div>

</body>

</html>
